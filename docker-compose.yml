services:
  mysql:
    image: mysql:8.4
    container_name: clausify-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: clausify
    ports:
      - "3306:3306"
    volumes:
      - clausify-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20
volumes:
  clausify-mysql-data:
