services:
  mysql:
    image: mysql:8.4
    container_name: clausify-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: clausify
    ports:
      # host:container. 3307 on the host avoids clashing with a locally installed MySQL.
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - clausify-mysql-data:/var/lib/mysql
    healthcheck:
      # $$ passes the variable through to the container's shell instead of compose.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 20
volumes:
  clausify-mysql-data:
