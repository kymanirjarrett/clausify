# Local development against the Docker MySQL from docker-compose.yml (host port 3307).
# Every value can still be overridden with an environment variable.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/clausify?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

clausify:
  jwt:
    # Local development only; never used in production (prod requires JWT_SECRET).
    secret: ${JWT_SECRET:local-dev-only-jwt-secret-not-for-production-0123456789}
  rate-limit:
    # Off for development and tests, which register and log in many times from one address.
    # RateLimitIntegrationTest turns it back on with small limits.
    enabled: false
  cors:
    # Angular dev server.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
