# Deployed API. Every value comes from the environment; nothing secret lives here.
# DB_URL is the full JDBC URL from the Aiven console, including its SSL parameters.
server:
  port: ${PORT:8080}
  # Vercel and Render terminate HTTPS and pass the original scheme and host in X-Forwarded-* headers;
  # trust them so Location headers point at the public URL instead of the container's.
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  ai:
    model:
      # Only the chat client, and only in prod. Groq has no embeddings API; FR-9 embeds in-process.
      chat: openai
    openai:
      # Groq's API is OpenAI-compatible, so Spring AI's OpenAI starter talks to it.
      # Spring AI 2.0's Groq guide: the base URL includes /v1.
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      # GroqContractAnalyzer retries 429s itself: the SDK caps each wait at 8s, Groq can ask for up to 60s.
      max-retries: 0
      chat:
        model: ${GROQ_MODEL:openai/gpt-oss-120b}
        # gpt-oss returns reasoning content; Groq rejects it if it is sent back on the next turn.
        replay-reasoning-content: false

clausify:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
