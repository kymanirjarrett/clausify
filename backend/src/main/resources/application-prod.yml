# Deployed API. Every value comes from the environment; nothing secret lives here.
# DB_URL is the TiDB Cloud Starter JDBC URL for the clausify database, with sslMode=VERIFY_IDENTITY (see .env.example).
server:
  port: ${PORT:8080}
  # Vercel and Render terminate HTTPS and pass the original scheme and host in X-Forwarded-* headers;
  # trust them so Location headers point at the public URL instead of the container's.
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # TiDB Starter drops AWS public-endpoint connections after 340 s idle; retiring each one at 5 min (TiDB's advice) means none outlives that.
      max-lifetime: 300000
  ai:
    model:
      # Only the chat client, and only in prod. Groq has no embeddings API; FR-9 embeds in-process.
      chat: openai
    openai:
      # Groq's API is OpenAI-compatible, so Spring AI's OpenAI starter talks to it.
      # Spring AI 2.0's Groq guide: the base URL includes /v1.
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      # GroqContractAnalyzer retries 429s itself: the SDK caps each wait at 8s, Groq can ask for up to 60s.
      max-retries: 0
      # Per HTTP request (Spring AI's default, stated so it is visible). A reply of 3,000 tokens takes seconds on
      # Groq; the whole analysis has its own limit, clausify.analysis.timeout.
      timeout: 60s
      chat:
        model: ${GROQ_MODEL:openai/gpt-oss-120b}
        # gpt-oss returns reasoning content; Groq rejects it if it is sent back on the next turn.
        replay-reasoning-content: false

clausify:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
