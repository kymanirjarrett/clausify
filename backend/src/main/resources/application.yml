# Shared settings for every environment. Profile files override these:
#   application-local.yml  developer machines (default)
#   application-prod.yml   deployed API (set SPRING_PROFILES_ACTIVE=prod)
spring:
  application:
    name: clausify-backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Store and read Instants as UTC regardless of the server or database time zone.
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Caps ?size= so one request cannot load a user's whole history.
        max-page-size: 100
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

clausify:
  # Abuse and cost limits (#80, ADR 0009). Each allows `capacity` requests per `period`, refilling smoothly.
  rate-limit:
    enabled: true
    login:                    # per client IP
      capacity: 10
      period: 1m
    register:                 # per client IP; generous so a classroom on one network can sign up
      capacity: 20
      period: 1h
    login-failures-per-email: # failed logins per account, from any IP
      capacity: 10
      period: 15m
    analysis:                 # uploads and retries per user; each one starts a Groq call
      capacity: 20
      period: 1h

management:
  endpoints:
    web:
      exposure:
        # Only the health check, for Render. Everything else (env, beans, heapdump) can leak secrets.
        include: health
      # No /actuator index page listing the endpoints.
      discovery:
        enabled: false
  endpoint:
    health:
      # UP or DOWN only; component details (database version, disk) stay private.
      show-details: never

server:
  tomcat:
    # After rejecting an upload over 10MB, Tomcat reads and discards the rest of the body (up to this size)
    # so the client receives the 413 response. Above it, Tomcat drops the connection and the browser sees a
    # network error instead. The Angular upload screen should also check size before sending.
    max-swallow-size: 50MB
