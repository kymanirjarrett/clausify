# Shared settings for every environment. Profile files override these:
#   application-local.yml  developer machines (default)
#   application-prod.yml   deployed API (set SPRING_PROFILES_ACTIVE=prod)
spring:
  application:
    name: clausify-backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Store and read Instants as UTC regardless of the server or database time zone.
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
