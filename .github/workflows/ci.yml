name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Integration tests start their own MySQL with Testcontainers (the runner has Docker),
    # so no database service is needed here.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          # verify always writes the report; a missing one means coverage silently stopped running.
          if-no-files-found: error

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Matches "engines" in frontend/package.json; a floating lts/* could jump majors under us.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # #59: the main journeys in a real browser against the real API (local profile, so the fake analyzer and no Groq)
    # and a real MySQL on the port the local profile expects.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: clausify
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API
        working-directory: backend
        run: |
          ./mvnw -B -q -DskipTests package
          nohup java -jar target/clausify-backend-*.jar > api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health && exit 0
            sleep 3
          done
          echo "API did not start"; tail -100 api.log; exit 1
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: frontend
        run: npx playwright test
      - name: API log
        if: failure()
        run: tail -200 backend/api.log
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  docker:
    name: docker
    runs-on: ubuntu-latest
    # Builds (never pushes) the Render image, so a broken Dockerfile fails here instead of on deploy.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for changes that affect the image
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
            || ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- backend/ render.yaml .github/workflows/ci.yml .github/scripts/; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend, deploy, or workflow changes; skipping the image build."
          fi
      - name: Build image
        if: steps.changes.outputs.backend == 'true'
        run: docker build -t clausify-api:ci backend
      # Runs the image the way Render does (prod profile) against a throwaway MySQL: health UP within a deadline,
      # then one authenticated request. Prints the API logs if anything fails.
      - name: Smoke-test image
        if: steps.changes.outputs.backend == 'true'
        run: .github/scripts/smoke-test-image.sh clausify-api:ci
