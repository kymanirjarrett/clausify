name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Integration tests start their own MySQL with Testcontainers (the runner has Docker),
    # so no database service is needed here.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npx ng test --watch=false
      - name: Production build
        run: npx ng build

  docker:
    name: docker
    runs-on: ubuntu-latest
    # Builds (never pushes) the Render image, so a broken Dockerfile fails here instead of on deploy.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for backend changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] \
            || ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- backend/; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend changes; skipping the image build."
          fi
      - name: Build image
        if: steps.changes.outputs.backend == 'true'
        run: docker build -t clausify-api:ci backend
