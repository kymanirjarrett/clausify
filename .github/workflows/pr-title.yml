name: PR title

# pull_request_target runs in the base repo's context so it can read PR metadata;
# it never checks out PR code, so it is safe for PRs from forks.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Keep in sync with CONTRIBUTING.md.
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            build
            perf
            style
          requireScope: false
          # Subject starts lowercase: "feat(auth): add login endpoint".
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in PR title "{title}" must start with a lowercase letter.
