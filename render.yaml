# Render Blueprint for the Clausify API (https://render.com/docs/blueprint-spec).
# Secrets are declared with sync: false, so Render asks for them when the Blueprint is created
# and they never live in git. Values that aren't secret are set here.
services:
  - type: web
    name: clausify-api
    runtime: docker
    plan: free
    # Nearest Render region to the Aiven service (DigitalOcean sfo); every query crosses this distance.
    region: oregon
    branch: main
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    # Deploy only after GitHub checks pass on main, so a red CI run never ships.
    autoDeployTrigger: checksPass
    # Frontend-only changes don't rebuild the API.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Random 256-bit value (44 base64 characters), above the 32-byte minimum JwtProperties enforces.
      - key: JWT_SECRET
        generateValue: true
      # Browsers reach the API through Vercel's same-origin proxy, so CORS only matters for direct calls.
      - key: CORS_ALLOWED_ORIGINS
        value: https://clausifysolutions.vercel.app
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
